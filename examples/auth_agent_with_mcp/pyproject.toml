[project]
name = "auth-agent-with-mcp-template"
version = "0.1.0"
description = "Auth Agent with MCP Template"
authors = []
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastmcp>=2.13.3",
    "structlog>=25.4.0",
    "cotality-mcp-sdk==0.2.2",
    "ecs-logging>=2.2.0",
    "google-adk>=2.0.0,<3.0.0",
    "google-genai>=2.4.0,<3",
    "python-dotenv>=0.9.9",
    "litellm>=1.83.7,<=1.83.14",
    "a2a-sdk>=0.3.23",
    "cotality-agent-sdk>=2.0.0",
    "auth0-api-python>=1.0.0b3",
    "auth0-python>=5.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "jfrog"
url = "https://artifactory.solutions.corelogic.com/artifactory/api/pypi/idap_agents_glb-agf-pypi-release-virtual/simple"
priority = "primary"

[tool.uv.sources]
cotality-agent-sdk = { index = "jfrog" }

