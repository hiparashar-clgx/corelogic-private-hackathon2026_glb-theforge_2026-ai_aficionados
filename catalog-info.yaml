apiVersion: ai.driveway.com/v1alpha1
kind: AgentCard
metadata:
  name: ${{GLOBAL:APPLICATION_NAME_HYPHEN}}
  title: ${{GLOBAL:APPLICATION_NAME_HYPHEN}}
  description: ${{DESCRIPTION}}
  labels:
    ai.driveway.com/model: ""
    ai.driveway.com/domain: ""
    ai.driveway.com/cost-tier: ""
spec:
  type: task
  lifecycle: experimental
  owner: group:default/${{GLOBAL:ORG_UNDERSCORE}}-${{GLOBAL:ECOSYSTEM}}-developers
  space: group:default/${{GLOBAL:ECOSYSTEM}}
  organization: group:default/${{GLOBAL:ORG_UNDERSCORE}}

  version: "0.0.1"
  url: "${{GLOBAL:ORG_HYPHEN}}-${{GLOBAL:APPLICATION_NAME_HYPHEN}}.cntvusw1uat.solutions.corelogic.com/.well-known/agent.json"
  protocolVersion: "0.2.5"

  skills:
    - id: security_analysis
      name: Security Analysis
      description: Identifies security vulnerabilities and suggests fixes
      tags: ["security", "analysis", "vulnerabilities"]

  capabilities: {}

  defaultInputModes:
    - "text/plain"
    - "application/x-python"
    - "application/javascript"
    - "application/json"

  defaultOutputModes:
    - "text/markdown"
    - "application/json"
