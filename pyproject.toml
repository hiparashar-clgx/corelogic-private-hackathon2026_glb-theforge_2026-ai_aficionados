[project]
name = "adk-template-base"
version = "2.1.0"
description = "${{DESCRIPTION}}"
authors = []
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "google-adk[extensions,mcp]>=2.6.3,<3",
    "google-genai>=2.4.0,<3",
    "pydantic>=2.12.5",
    "google-cloud-aiplatform>=1.138.0",
    "dotenv>=0.9.9",
    "a2a-sdk>=1.1.2,<2.0.0",
    "cotality-agent-sdk>=2.1.5",
    "litellm>=1.84",
    "auth0-api-python>=1.0.0b3",
    "auth0-python>=5.1.0",
    "httpx>=0.28.1",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.15.1",
]
dev = [
    "behave>=1.2.6",
    "magicmock>=0.3",
    "mypy>=1.19.1",
    "nox>=2026.2.9",
    "pytest>=9.0.2",
    "pytest-anyio>=0.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
    "pysonar>=1.0.1.1548",
    "markdown>=3.10.2",
    "types-markdown>=3.10.2.20260211",
    "cotality-agent-eval-sdk>=2.1.7",
]

[project.scripts]
app = "src.cotality.agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[[tool.uv.index]]
name = "jfrog"
url = "https://artifactory.solutions.corelogic.com/artifactory/api/pypi/idap_agents_glb-agf-pypi-release-virtual/simple"
priority = "primary"

[tool.uv.sources]
cotality-agent-sdk = { index = "jfrog" }
cotality-agent-eval-sdk = { index = "jfrog" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
# The eval SDK resolves `agent_module_path` (e.g. "src/cotality") to a dotted
# module name by stripping the leading "src/" (i.e. "cotality.agent"), which
# requires "src" itself to be importable from. Add it to sys.path for tests
# only, without changing the project's wheel packaging convention.
pythonpath = ["src"]

[tool.mypy]
exclude = [
    "lib",
    "data",
]
warn_return_any = true
warn_unused_configs = true
follow_imports = "normal"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["cotality_agent_eval_sdk"]
ignore_missing_imports = true
