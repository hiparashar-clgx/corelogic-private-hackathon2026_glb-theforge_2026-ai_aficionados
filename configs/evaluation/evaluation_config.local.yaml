# Cotality Agent Eval SDK configuration.
#
# This file wires the ADK agent evaluation harness (tests/integration/test_adk_evaluation.py)
# to the internal `cotality-agent-eval-sdk` package instead of the native ADK
# `AgentEvaluator`, giving standardized Cotality evaluation reporting and (optionally)
# automatic GCS result publishing.
#
# Env selection: the `ENV` environment variable (see .env.example) picks the config file:
#   - ENV unset or ENV=local -> evaluation_config.local.yaml (this file)
#   - ENV=<name>             -> evaluation_config.<name>.yaml (e.g. evaluation_config.dev.yaml)
#
# Full reference: https://github.com/corelogic-private/idap_agents_glb-ag_foundation-cotality_agent_eval_sdk

evaluator_type: cotality_adk

# Dotted-path-style location of the agent module to evaluate, relative to the project root.
agent_module_path: src/cotality

# Local directory where evaluation reports (HTML/JSON/JUnit) are written.
results_dir: tests/integration/results

# Evaluation criteria/thresholds are read from tests/integration/test_config.json
# (ADK's native EvalConfig convention). Set adk_eval_config_path below to point at a
# different file if you move or rename it.
# adk_eval_config_path: tests/integration/test_config.json

# --- GCS result publishing --------------------------------------------------------
# Uncomment and fill in to automatically publish evaluation results to a GCS bucket
# in addition to the local results_dir above. `app_name`, `org`, and `space` are
# REQUIRED as soon as GCS publishing is enabled (they build the GCS result path:
# eval-results/{workload_type}/{org}/{space}/{app_name}/{date}/{run_id}.json) and
# must not contain "/" or "\".
#
# gcs_results_dir: gs://<your-bucket>/<your-agent-name>/eval-results
# app_name: <your-agent-name>
# org: ${{GLOBAL:ORG_HYPHEN}}
# space: ${{GLOBAL:ECOSYSTEM}}

# Environment variables to export before the evaluation run (e.g. LITELLM_API_BASE).
environment: {}
